    <text x="28" y="180" font-size="64" font-weight="800" letter-spacing="-3">Kathiravan</text>
    <text x="28" y="247" font-size="64" font-weight="800" letter-spacing="-3">Vittobha<tspan fill="#c25429">.</tspan></text>
    <text x="32" y="286" font-size="17" fill="#57534e">AI Systems Engineer</text>
    <text x="32" y="340" font-size="16">Building scalable systems</text>
    <text x="32" y="363" font-size="16">with TypeScript.</text>
  </g>
