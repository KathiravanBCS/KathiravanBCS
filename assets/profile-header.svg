    <text x="622" y="208" fill="#d7d3c8">ui: <tspan fill="#bbcf9f">"React + Next.js"</tspan>,</text>
    <text x="622" y="232" fill="#d7d3c8">api: <tspan fill="#bbcf9f">"NestJS + Prisma"</tspan>,</text>
