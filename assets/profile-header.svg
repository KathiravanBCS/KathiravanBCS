    <text x="968" y="36" text-anchor="end">CHENNAI, INDIA ↗</text>
    <text x="32" y="419">TYPESCRIPT / REACT / NEXT.JS / NESTJS</text>
    <text x="968" y="419" text-anchor="end">CODE. CONNECT. BUILD.</text>
  </g>
