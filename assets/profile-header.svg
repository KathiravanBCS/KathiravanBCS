<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
  <title id="title">Kathiravan Vittobha — Full Stack Developer and AI Systems Engineer</title>
  <desc id="desc">An editorial developer workspace in warm ivory, charcoal, and vermilion. Large stacked typography sits beside a terminal showing React, Next.js, NestJS, and TypeScript. A terminal illustration connects interface, API, and data. Chennai, India.</desc>
  <style>
    .sans { font-family: Arial, Helvetica, sans-serif; }
    .mono { font-family: 'Courier New', monospace; }
  </style>
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#d3cfc5"/></pattern>
  </defs>
  <rect width="1000" height="440" rx="3" fill="#f5f2e9"/>
  <rect x="1" y="1" width="998" height="438" rx="3" fill="none" stroke="#d8d3c8"/>
  <rect x="565" y="1" width="434" height="438" fill="url(#dots)"/>
