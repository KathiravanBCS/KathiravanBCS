<svg xmlns="http://www.w3.org/2000/svg" width="250" height="82" viewBox="0 0 250 82" role="img" aria-labelledby="title desc">
  <title id="title">X / Twitter — Follow along</title>
  <desc id="desc">Contact card with a X / Twitter icon and a gently moving arrow.</desc>
  <style>
    text { font-family: 'Poppins', sans-serif; }
    .arrow { animation: invite 4s ease-in-out infinite; animation-delay: -1.6s; }
